name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    env:
      MYSQL_ROOT_PASSWORD: root
      POSTGRES_PASSWORD: postgres
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ${{ env.MYSQL_ROOT_PASSWORD }}
          MYSQL_DATABASE: openlens
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -uroot -p$MYSQL_ROOT_PASSWORD"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: ${{ env.POSTGRES_PASSWORD }}
          POSTGRES_DB: openlens
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: uv sync --group dev
      - run: uv run ruff check src tests
      - run: uv run ruff format --check src tests
      - run: uv run mypy src
      - run: uv run pytest tests -q
      - run: uv run pip-audit
      # Storage live conformance (task 19, scope item 2): install the
      # driver extras matching each service container, then run the
      # env-gated suites live with zero skips expected.
      - run: uv sync --extra mysql --extra postgres --group dev
      - name: MySQL storage conformance (live)
        env:
          OPENLENS_TEST_MYSQL_DSN: mysql://root:root@127.0.0.1:3306/openlens
        run: |
          set -o pipefail
          uv run pytest tests/integration/test_storage_mysql.py -q -rs 2>&1 | tee /tmp/mysql-storage.log
          if grep -Eq "[0-9]+ skipped" /tmp/mysql-storage.log; then
            echo "::error::MySQL live suite reported skips; zero skips expected"
            exit 1
          fi
      - name: Postgres storage conformance (live)
        env:
          OPENLENS_TEST_PG_DSN: postgresql://postgres:postgres@127.0.0.1:5432/openlens
        run: |
          set -o pipefail
          uv run pytest tests/integration/test_storage_postgres.py -q -rs 2>&1 | tee /tmp/pg-storage.log
          if grep -Eq "[0-9]+ skipped" /tmp/pg-storage.log; then
            echo "::error::Postgres live suite reported skips; zero skips expected"
            exit 1
          fi

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npm run build
      # Prod-only gate: must pass. The full `npm audit` currently reports
      # 3 dev-only findings in vitest's transitive deps (@vitest/mocker,
      # tinypool) whose only fix is a breaking major to vitest@5 (needs
      # explicit approval); recorded as acknowledged risk, not silent.
      - run: npm audit --omit=dev

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
