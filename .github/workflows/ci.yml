name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: uv sync --group dev
      - run: uv run ruff check src tests
      - run: uv run ruff format --check src tests
      - run: uv run mypy src
      - run: uv run pytest tests -q
      - run: uv run pip-audit
      # Storage live conformance (task 19) is permanently skipped for
      # both server backends; see tests/integration/test_storage_mysql.py
      # and test_storage_postgres.py. The driver extras below stay: the
      # non-live lazy-import/error-mapping tests still need them installed.
      - run: uv sync --extra mysql --group dev

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npm run build
      # Prod-only gate: must pass. The full `npm audit` currently reports
      # 3 dev-only findings in vitest's transitive deps (@vitest/mocker,
      # tinypool) whose only fix is a breaking major to vitest@5 (needs
      # explicit approval); recorded as acknowledged risk, not silent.
      - run: npm audit --omit=dev

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
