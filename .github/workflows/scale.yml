name: scale

# Manually scale the release stack up or down (horizontal and/or
# vertical). Run from Actions -> scale -> Run workflow.
#
# - Horizontal (replicas): only the stateless worker pools support
#   more than one replica — `crawler`, `crawler-backoff`, and
#   `analytics-worker`. The count is persisted in the server-side
#   release.env (CRAWLER_SCALE / CRAWLER_BACKOFF_SCALE /
#   ANALYTICS_WORKER_SCALE), so the next release deploy keeps it.
#   Every other service is a singleton (host ports, single
#   primary, or single broker). replicas=1 on a singleton recreates
#   it (ensure-one-running, nothing persisted); replicas=0 and >1
#   are rejected for those.
# - Vertical (cpus / memory): applies live to every running
#   container of the service via `docker update`, no restart.
#   It does NOT survive a container recreate — the next
#   `compose up --build` for that service restores the limits
#   from deploy/local/docker-compose.yml.
#
# Examples:
#   service=crawler, replicas=6            -> 6 crawl workers
#   service=backend, cpus=2.0, memory=2G   -> shrink backend live
#   service=clickhouse, memory=8G          -> grow ClickHouse live

on:
  workflow_dispatch:
    inputs:
      service:
        description: "Compose service to scale."
        required: true
        type: choice
        options:
          - backend
          - frontend
          - admin-frontend
          - crawler
          - crawler-backoff
          - analytics-worker
          - postgres
          - postgres-replica
          - redis
          - kafka-1
          - kafka-ui
          - pgadmin
          - clickhouse
          - dozzle
      replicas:
        description: "Horizontal: replica count (0-24; worker pools only, except replicas=1 recreates a singleton; empty = leave unchanged)."
        required: false
        default: ""
      cpus:
        description: "Vertical: CPUs per container, e.g. 0.5, 2.0 (empty = leave unchanged)."
        required: false
        default: ""
      memory:
        description: "Vertical: RAM per container, e.g. 512M, 1G, 4G (empty = leave unchanged)."
        required: false
        default: ""

concurrency:
  group: release-production
  cancel-in-progress: false

jobs:
  scale:
    # Same self-hosted runner as the release workflow: scaling runs
    # docker commands against the release server itself.
    runs-on: [self-hosted, openlens-release]
    timeout-minutes: 20
    steps:
      - name: Check out repo (service validation)
        uses: actions/checkout@v5

      - name: Validate inputs
        id: validate
        working-directory: deploy/local
        run: |
          SVC="${{ inputs.service }}"
          REPLICAS="${{ inputs.replicas }}"
          CPUS="${{ inputs.cpus }}"
          MEMORY="${{ inputs.memory }}"

          if ! docker compose config --services 2>/dev/null | grep -qx "$SVC"; then
            echo "unknown compose service: $SVC"; exit 1
          fi

          if [ -z "$REPLICAS" ] && [ -z "$CPUS" ] && [ -z "$MEMORY" ]; then
            echo "nothing to do: set at least one of replicas, cpus, memory"; exit 1
          fi

          if [ -n "$REPLICAS" ]; then
            case "$REPLICAS" in
              ''|*[!0-9]*) echo "replicas must be a whole number 0-24, got: $REPLICAS"; exit 1 ;;
            esac
            if [ "$REPLICAS" -gt 24 ]; then
              echo "replicas capped at 24 (Kafka topic partition count), got: $REPLICAS"; exit 1
            fi
            # Only the stateless Kafka-consumer pools can run >1:
            # the rest bind host ports or are single-primary stores.
            # replicas=1 on a singleton is an ensure-one-running
            # recreate (nothing persisted); 0 and >1 stay rejected.
            case "$SVC" in
              crawler|crawler-backoff|analytics-worker) ;;
              *)
                if [ "$REPLICAS" != "1" ]; then
                  echo "replicas=$REPLICAS not supported for singleton service: $SVC (allowed: crawler, crawler-backoff, analytics-worker). Use replicas=1 to recreate it, the release workflow (selective deploy) to restart it, or cpus/memory for live tuning."; exit 1
                fi
                echo "singleton service $SVC: replicas=1 recreates it (no scale value persisted)"
                ;;
            esac
            case "$SVC" in
              crawler) SCALE_VAR="CRAWLER_SCALE" ;;
              crawler-backoff) SCALE_VAR="CRAWLER_BACKOFF_SCALE" ;;
              analytics-worker) SCALE_VAR="ANALYTICS_WORKER_SCALE" ;;
            esac
            echo "scale_var=$SCALE_VAR" >> "$GITHUB_OUTPUT"
          fi

          if [ -n "$CPUS" ]; then
            if ! printf '%s' "$CPUS" | grep -Eq '^[0-9]+(\.[0-9]+)?$'; then
              echo "cpus must be a positive number, e.g. 0.5 or 2.0, got: $CPUS"; exit 1
            fi
            if [ "$(printf '%s' "$CPUS" | awk '{print ($1 <= 0)}')" = "1" ]; then
              echo "cpus must be greater than 0, got: $CPUS"; exit 1
            fi
          fi

          if [ -n "$MEMORY" ]; then
            if ! printf '%s' "$MEMORY" | grep -Eq '^[0-9]+[mMgG][bB]?$'; then
              echo "memory must look like 512M, 1G, 4096M, got: $MEMORY"; exit 1
            fi
          fi

          echo "service=$SVC" >> "$GITHUB_OUTPUT"

      - name: Horizontal scale (replicas)
        if: inputs.replicas != ''
        working-directory: deploy/local
        run: |
          SVC="${{ inputs.service }}"
          VAR="${{ steps.validate.outputs.scale_var }}"
          ENV_FILE="/home/rajan/servers/release.env"
          test -f "$ENV_FILE" || { echo "missing server env file: $ENV_FILE"; exit 1; }
          if [ -n "$VAR" ]; then
            if grep -q "^${VAR}=" "$ENV_FILE"; then
              sed -i "s/^${VAR}=.*/${VAR}=${{ inputs.replicas }}/" "$ENV_FILE"
            else
              echo "${VAR}=${{ inputs.replicas }}" >> "$ENV_FILE"
            fi
            # .env is what compose interpolates; keep it in sync like
            # the release workflow does so `deploy.replicas` reconciles.
            cp "$ENV_FILE" .env
          fi
          docker compose up -d "$SVC"
          if [ -n "$VAR" ]; then
            echo "replicas for $SVC now: ${{ inputs.replicas }} (persisted as $VAR)"
          else
            echo "$SVC recreated (singleton replicas=1: one copy ensured, nothing persisted)"
          fi

      - name: Vertical scale (cpus / memory)
        if: inputs.cpus != '' || inputs.memory != ''
        working-directory: deploy/local
        run: |
          SVC="${{ inputs.service }}"
          # shellcheck disable=SC2207
          IDS=($(docker compose ps -q "$SVC"))
          if [ "${#IDS[@]}" -eq 0 ]; then
            echo "no running containers for service: $SVC"; exit 1
          fi
          ARGS=""
          [ -n "${{ inputs.cpus }}" ] && ARGS="$ARGS --cpus ${{ inputs.cpus }}"
          [ -n "${{ inputs.memory }}" ] && ARGS="$ARGS --memory ${{ inputs.memory }}"
          # shellcheck disable=SC2086
          docker update $ARGS "${IDS[@]}"
          echo "updated ${#IDS[@]} container(s) of $SVC: cpus='${{ inputs.cpus }}' memory='${{ inputs.memory }}'"

      - name: Verify and report
        if: always()
        working-directory: deploy/local
        run: |
          SVC="${{ inputs.service }}"
          docker compose ps "$SVC"
          echo "--- live usage ---"
          # shellcheck disable=SC2207
          IDS=($(docker compose ps -q "$SVC"))
          if [ "${#IDS[@]}" -gt 0 ]; then
            docker stats --no-stream "${IDS[@]}"
          else
            echo "no running containers for $SVC (scaled to 0 or stopped)"
          fi
          if [ "$SVC" = "backend" ]; then
            curl -fsS http://localhost:8000/healthz
          fi
