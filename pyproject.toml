[project]
name = "openlens"
version = "0.1.0"
description = "OpenLens"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "@rajanbajaj" }]
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "pyyaml>=6",
  "httpx>=0.27",
  # Postgres is the default store, so its driver ships in the base
  # install (binary wheel, no system libpq needed).
  "psycopg[binary]>=3.1",
  # Redis is the default cache backend, so its driver ships too.
  "redis>=5",
  # Live frontier stats stream (`/api/v1/frontier/live` websocket) needs a
  # websocket stack for uvicorn/starlette; pure-python, no system deps.
  "websockets>=14",
]

[project.optional-dependencies]
# MySQL stays an extra (driver-only). Cache/storage drivers stay
# lazy-imported, so unconfigured backends add no import-time cost.
mysql = ["pymysql>=1.1"]
kafka = ["kafka-python-ng>=2.1.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/openlens"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 88

[tool.ruff.lint]
# Defaults plus flake8-bandit security rules; each ignore needs justification.
select = ["E", "F", "S"]

[tool.ruff.lint.per-file-ignores]
# pytest asserts are the assertion mechanism; S101 would ban the framework.
"tests/**/*.py" = ["S101"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
show_error_codes = true

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pip-audit>=2.10.1",
    "pytest>=8",
    "ruff>=0.17.3",
    "types-pyyaml>=6.0.12.20260906",
]
