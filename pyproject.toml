[project]
name = "openlens"
version = "0.1.0"
description = "OpenLens"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "@rajanbajaj" }]
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "pyyaml>=6",
  "httpx>=0.27",
  "opensearch-py>=2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/openlens"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 88

[tool.ruff.lint]
# Defaults plus flake8-bandit security rules; each ignore needs justification.
select = ["E", "F", "S"]

[tool.ruff.lint.per-file-ignores]
# pytest asserts are the assertion mechanism; S101 would ban the framework.
"tests/**/*.py" = ["S101"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
show_error_codes = true

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pip-audit>=2.10.1",
    "pytest>=8",
    "ruff>=0.17.3",
    "types-pyyaml>=6.0.12.20260906",
]
