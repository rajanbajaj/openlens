[project]
name = "openlens"
version = "0.1.0"
description = "OpenLens"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "@rajanbajaj" }]
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "pyyaml>=6",
  "httpx>=0.27",
  "opensearch-py>=2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/openlens"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = ["pytest>=8"]
