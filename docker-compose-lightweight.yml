# OpenLens lightweight stack: search end-to-end on 4 vCPU / 4 GB RAM.
#
# Keeps only the request path: backend API + user frontend + Postgres
# store + Redis result cache + 1 store-backed crawler. Everything else
# from deploy/local/docker-compose.yml is dropped on purpose:
#   - no Kafka (OPENLENS_KAFKA_ENABLED=false -> store claim path)
#   - no redis-frontier (OPENLENS_FRONTIER_BACKEND=postgres)
#   - no ClickHouse / analytics-worker (analytics on SQLite file)
#   - no postgres-replica, pgAdmin, kafka-ui, dozzle, crawler-backoff
#   - admin-frontend is opt-in via `--profile admin`
#
# backend/crawler use Dockerfile.backend-lightweight (base deps only, no
# `[kafka,analytics]` extras): with no broker or ClickHouse in this stack
# the drivers would only add import weight and background reconnect
# threads. All Kafka/ClickHouse call sites degrade cleanly without them.
#
# Budget (defaults below, all overridable like the full stack):
#   postgres ~1G/1.0 + redis ~256M/0.25 + backend ~1G/1.5
#   + crawler ~512M/0.5 + frontend ~128M/0.25 ≈ 2.9G / ~3.25 CPU,
#   leaving OS headroom inside 4G/4CPU.
#
# From the repo root:
#   docker compose -f docker-compose-lightweight.yml up --build -d
#   docker compose --profile admin -f docker-compose-lightweight.yml up --build -d
# Frontend: http://localhost:3000, Backend: http://localhost:8000 (/healthz).
name: openlens-lightweight

# Shared json-file log rotation so container logs cannot fill the host
# disk. Applied per service via the `*default-logging` alias.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  backend:
    build:
      context: .
      dockerfile: deploy/local/Dockerfile.backend-lightweight
    # Single worker: keeps RSS near ~300-500MB and avoids duplicating
    # the Postgres pools (each worker holds ~2 x pool_size conns).
    command: ["uvicorn", "openlens.main:app", "--host", "0.0.0.0", "--port", "8000", "--workers", "1"]
    mem_limit: ${BACKEND_MEM:-1G}
    cpus: ${BACKEND_CPUS:-1.5}
    logging: *default-logging
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    environment:
      OPENLENS_PG_HOST: postgres
      OPENLENS_PG_PORT: 5432
      OPENLENS_PG_DBNAME: ${POSTGRES_DB:-openlens}
      OPENLENS_PG_USER: ${POSTGRES_USER:-openlens}
      OPENLENS_PG_PASSWORD: ${POSTGRES_PASSWORD:-openlens}
      # Empty replica host disables replica reads (primary serves all).
      OPENLENS_PG_REPLICA_HOST: ${OPENLENS_PG_REPLICA_HOST:-}
      OPENLENS_PG_POOL_SIZE: ${OPENLENS_PG_POOL_SIZE:-2}
      OPENLENS_REDIS_URL: redis://redis:6379/0
      # Store-backed frontier: no redis-frontier service needed.
      OPENLENS_FRONTIER_BACKEND: postgres
      # Kafka off: seeds drain through the Postgres frontier claim path.
      OPENLENS_KAFKA_ENABLED: "false"
      # Analytics on the SQLite file (no ClickHouse / worker needed).
      OPENLENS_ANALYTICS_ENABLED: ${OPENLENS_ANALYTICS_ENABLED:-true}
      OPENLENS_ANALYTICS_BACKEND: sqlite
      MODEL_ENABLED: ${MODEL_ENABLED:-false}
      MODEL_API_KEY: ${MODEL_API_KEY:-}
      MODEL_BASE_URL: ${MODEL_BASE_URL:-https://api.meta.ai/v1}
      MODEL_NAME: ${MODEL_NAME:-muse-spark-1.3-contributor}
      OPENLENS_RATE_LIMIT_ENABLED: ${OPENLENS_RATE_LIMIT_ENABLED:-}
      OPENLENS_RATE_LIMIT_SEARCH: ${OPENLENS_RATE_LIMIT_SEARCH:-}
      OPENLENS_RATE_LIMIT_SUGGEST: ${OPENLENS_RATE_LIMIT_SUGGEST:-}
      OPENLENS_RATE_LIMIT_FEEDBACK: ${OPENLENS_RATE_LIMIT_FEEDBACK:-}
      OPENLENS_RATE_LIMIT_ADMIN: ${OPENLENS_RATE_LIMIT_ADMIN:-}
      OPENLENS_RATE_LIMIT_WS: ${OPENLENS_RATE_LIMIT_WS:-}
      OPENLENS_FRONTIER_ADMIN_TOKEN: ${OPENLENS_FRONTIER_ADMIN_TOKEN:-}
      OPENLENS_ALLOW_OPEN_ADMIN: ${OPENLENS_ALLOW_OPEN_ADMIN:-}
    volumes:
      - openlens-data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz')\""]
      interval: 15s
      timeout: 5s
      retries: 12
    networks:
      - openlens

  frontend:
    build:
      context: .
      dockerfile: deploy/local/Dockerfile.frontend
      args:
        VITE_OPENLENS_API_URL: ${VITE_OPENLENS_API_URL:-}
        VITE_OPENLENS_DEV_MODE: ${VITE_OPENLENS_DEV_MODE:-}
    mem_limit: ${FRONTEND_MEM:-128M}
    cpus: ${FRONTEND_CPUS:-0.25}
    logging: *default-logging
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks:
      - openlens

  # Opt-in admin console (frontier dashboard + config editors). Off by
  # default; start with `docker compose -f docker-compose-lightweight.yml
  # --profile admin up -d`. Same X-Admin-Token gate as the full stack.
  admin-frontend:
    profiles: [admin]
    build:
      context: .
      dockerfile: deploy/local/Dockerfile.admin-frontend
      args:
        VITE_OPENLENS_API_URL: ${VITE_OPENLENS_API_URL:-}
    mem_limit: ${ADMIN_FRONTEND_MEM:-128M}
    cpus: ${ADMIN_FRONTEND_CPUS:-0.25}
    logging: *default-logging
    restart: unless-stopped
    ports:
      - "${ADMIN_FRONTEND_PORT:-3001}:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks:
      - openlens

  # Single store-backed crawl worker: drains the Postgres frontier until
  # exhausted (no Kafka consumer group). Scale stays 1 on this host;
  # throughput is deliberately lower than the full Kafka fleet.
  crawler:
    build:
      context: .
      dockerfile: deploy/local/Dockerfile.backend-lightweight
    command: ["sh", "-c", "exec python -m openlens.cli crawl-worker --queue store --crawl-id \"$${OPENLENS_CRAWL_ID:-default}\""]
    mem_limit: ${CRAWLER_MEM:-512M}
    cpus: ${CRAWLER_CPUS:-0.5}
    logging: *default-logging
    restart: unless-stopped
    volumes:
      - openlens-data:/app/data
    environment:
      OPENLENS_API_URL: http://backend:8000
      OPENLENS_PG_HOST: postgres
      OPENLENS_PG_PORT: 5432
      OPENLENS_PG_DBNAME: ${POSTGRES_DB:-openlens}
      OPENLENS_PG_USER: ${POSTGRES_USER:-openlens}
      OPENLENS_PG_PASSWORD: ${POSTGRES_PASSWORD:-openlens}
      OPENLENS_PG_POOL_SIZE: ${OPENLENS_PG_POOL_SIZE:-2}
      OPENLENS_REDIS_URL: redis://redis:6379/0
      OPENLENS_KAFKA_ENABLED: "false"
      OPENLENS_FRONTIER_BACKEND: postgres
      OPENLENS_CRAWL_ID: ${OPENLENS_CRAWL_ID:-default}
      OPENLENS_WORKER_ID: ${OPENLENS_WORKER_ID:-}
      OPENLENS_HEARTBEAT_INTERVAL_S: ${OPENLENS_HEARTBEAT_INTERVAL_S:-40}
      OPENLENS_FRONTIER_ADMIN_TOKEN: ${OPENLENS_FRONTIER_ADMIN_TOKEN:-}
      MODEL_ENABLED: ${MODEL_ENABLED:-false}
      MODEL_API_KEY: ${MODEL_API_KEY:-}
      MODEL_BASE_URL: ${MODEL_BASE_URL:-https://api.meta.ai/v1}
      MODEL_NAME: ${MODEL_NAME:-muse-spark-1.3-contributor}
    depends_on:
      backend:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "grep -q crawl-worker /proc/1/cmdline || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks:
      - openlens

  postgres:
    image: postgres:16
    mem_limit: ${POSTGRES_MEM:-1G}
    cpus: ${POSTGRES_CPUS:-1.0}
    logging: *default-logging
    restart: unless-stopped
    # Small shared_buffers + few connections for a 1G box. Each
    # backend/crawler process holds ~2 pools x OPENLENS_PG_POOL_SIZE
    # connections (default 2 -> ~4 per process here), so 50 covers this
    # stack with margin. Raise POSTGRES_MAX_CONNECTIONS only if you add
    # replicas/workers back.
    command: postgres -c max_connections=${POSTGRES_MAX_CONNECTIONS:-50} -c shared_buffers=128MB
    shm_size: 128mb
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-openlens}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-openlens}
      POSTGRES_DB: ${POSTGRES_DB:-openlens}
    ports:
      - "${POSTGRES_HOST:-127.0.0.1}:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-openlens} -d $${POSTGRES_DB:-openlens}"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks:
      - openlens

  redis:
    image: redis:7-alpine
    mem_limit: ${REDIS_MEM:-256M}
    cpus: ${REDIS_CPUS:-0.25}
    logging: *default-logging
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "64mb", "--maxmemory-policy", "allkeys-lru"]
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks:
      - openlens

volumes:
  openlens-data:
  pgdata:
  redis-data:

networks:
  openlens:
