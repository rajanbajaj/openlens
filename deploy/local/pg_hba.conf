# Custom pg_hba for the primary: stock image config has no replication
# entry, so the replica's pg_basebackup/walreceiver would be rejected
# with "no pg_hba.conf entry for replication connection". Local-only
# LAN stack: password (scram) auth, same as the rest of this file.
# TYPE  DATABASE        USER  ADDRESS  METHOD
local   all             all            trust
host    all             all   all      scram-sha-256
host    replication     all   all      scram-sha-256
