# Same-origin /api/ proxy (avoids CORS); SPA fallback for the admin shell.
server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Docker DNS with a short TTL: backend keeps its name but changes IP
    # across recreates, and nginx must re-resolve instead of caching startup DNS.
    resolver 127.0.0.11 valid=10s;

    location /api/ {
        set $upstream http://backend:8000;
        proxy_pass $upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
