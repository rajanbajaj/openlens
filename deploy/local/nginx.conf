# Same-origin /api/ proxy (avoids CORS); SPA fallback for the app shell.
server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Docker DNS with a short TTL: backend keeps its name but changes IP
    # across recreates, and nginx must re-resolve instead of caching startup DNS.
    resolver 127.0.0.11 valid=10s;

    location /api/ {
        set $upstream http://backend:8000;
        proxy_pass $upstream;
        # Websocket upgrades (e.g. future live endpoints) need HTTP/1.1
        # plus the Upgrade handshake headers; plain HTTP is unaffected.
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
