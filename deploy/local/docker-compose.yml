# OpenLens local stack: backend API, frontend app, Postgres store,
# and pgAdmin browser UI (phpMyAdmin-style login for Postgres).
name: openlens-local

# Shared json-file log rotation so container logs cannot fill the host
# disk. Applied per service via the `*default-logging` alias.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  backend:
    build:
      context: ../..
      dockerfile: deploy/local/Dockerfile.backend
    mem_limit: 1G
    cpus: 1.0
    logging: *default-logging
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    environment:
      OPENLENS_PG_HOST: postgres
      OPENLENS_PG_PORT: 5432
      OPENLENS_PG_DBNAME: ${POSTGRES_DB:-openlens}
      OPENLENS_PG_USER: ${POSTGRES_USER:-openlens}
      OPENLENS_PG_PASSWORD: ${POSTGRES_PASSWORD:-openlens}
      OPENLENS_PG_REPLICA_HOST: ${OPENLENS_PG_REPLICA_HOST:-postgres-replica}
      OPENLENS_PG_REPLICA_PORT: ${OPENLENS_PG_REPLICA_PORT:-5432}
      OPENLENS_REDIS_URL: redis://redis:6379/0
      OPENLENS_KAFKA_ENABLED: ${OPENLENS_KAFKA_ENABLED:-true}
      OPENLENS_KAFKA_BOOTSTRAP_SERVERS: ${OPENLENS_KAFKA_BOOTSTRAP_SERVERS:-kafka-1:19092,kafka-2:19092,kafka-3:19092}
      OPENLENS_KAFKA_TOPIC: ${OPENLENS_KAFKA_TOPIC:-crawl.urls}
      OPENLENS_KAFKA_GROUP_ID: ${OPENLENS_KAFKA_GROUP_ID:-crawlers}
      MODEL_ENABLED: ${MODEL_ENABLED:-false}
      MODEL_API_KEY: ${MODEL_API_KEY:-}
      MODEL_BASE_URL: ${MODEL_BASE_URL:-https://api.meta.ai/v1}
      MODEL_NAME: ${MODEL_NAME:-muse-spark-1.3-contributor}
      OPENLENS_RATE_LIMIT_ENABLED: ${OPENLENS_RATE_LIMIT_ENABLED:-}
      OPENLENS_RATE_LIMIT_SEARCH: ${OPENLENS_RATE_LIMIT_SEARCH:-}
      OPENLENS_RATE_LIMIT_SUGGEST: ${OPENLENS_RATE_LIMIT_SUGGEST:-}
      OPENLENS_RATE_LIMIT_FEEDBACK: ${OPENLENS_RATE_LIMIT_FEEDBACK:-}
      OPENLENS_RATE_LIMIT_ADMIN: ${OPENLENS_RATE_LIMIT_ADMIN:-}
      OPENLENS_RATE_LIMIT_WS: ${OPENLENS_RATE_LIMIT_WS:-}
      OPENLENS_FRONTIER_ADMIN_TOKEN: ${OPENLENS_FRONTIER_ADMIN_TOKEN:-}
      OPENLENS_ALLOW_OPEN_ADMIN: ${OPENLENS_ALLOW_OPEN_ADMIN:-}
    volumes:
      - openlens-data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka-1:
        condition: service_healthy
      kafka-2:
        condition: service_healthy
      kafka-3:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz')\""]
      interval: 10s
      timeout: 5s
      retries: 12
    networks:
      - openlens

  frontend:
    build:
      context: ../..
      dockerfile: deploy/local/Dockerfile.frontend
      args:
        VITE_OPENLENS_API_URL: ${VITE_OPENLENS_API_URL:-}
        VITE_OPENLENS_DEV_MODE: ${VITE_OPENLENS_DEV_MODE:-}
    mem_limit: 512M
    cpus: 0.5
    logging: *default-logging
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks:
      - openlens

  admin-frontend:
    build:
      context: ../..
      dockerfile: deploy/local/Dockerfile.admin-frontend
      args:
        VITE_OPENLENS_API_URL: ${VITE_OPENLENS_API_URL:-}
    mem_limit: 512M
    cpus: 0.5
    logging: *default-logging
    ports:
      - "${ADMIN_FRONTEND_PORT:-3001}:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks:
      - openlens

  # Distributed-crawl worker: same image as `backend`. Every replica
  # joins the same Kafka consumer group (`crawlers`), so the
  # `crawl.urls` topic assigns each URL to exactly one live worker.
  # Scale with:
  #
  #   docker compose -f deploy/local/docker-compose.yml up --build -d --scale crawler=3
  #
  # The Kafka consume loop (`crawl-worker --queue kafka`) is PID 1 and
  # owns SIGTERM. It reports its own heartbeat to the backend (liveness
  # + owned-row `claimed` counts + last discovery summary), so the
  # dashboard Workers view shows every replica with real numbers — no
  # sidecar reporter needed (a second process could only send zeros
  # under a different id). `OPENLENS_WORKER_ID` is intentionally left
  # empty so each replica auto-resolves a unique
  # `{hostname}-{pid}-{rand}` id (Compose gives every replica its own
  # hostname; stale rows age out of the Workers view). Set it explicitly
  # only to pin one replica's identity. Postgres keeps documents,
  # checkpoints, settings, and the seen-set; size `max_connections` as
  # N * (pool_size * 2).
  crawler:
    build:
      context: ../..
      dockerfile: deploy/local/Dockerfile.backend
    command: ["sh", "-c", "exec python -m openlens.cli crawl-worker --queue kafka --crawl-id \"$${OPENLENS_CRAWL_ID:-default}\""]
    mem_limit: 2G
    cpus: 1.0
    logging: *default-logging
    volumes:
      - openlens-data:/app/data
    environment:
      OPENLENS_API_URL: http://backend:8000
      OPENLENS_PG_HOST: postgres
      OPENLENS_PG_PORT: 5432
      OPENLENS_PG_DBNAME: ${POSTGRES_DB:-openlens}
      OPENLENS_PG_USER: ${POSTGRES_USER:-openlens}
      OPENLENS_PG_PASSWORD: ${POSTGRES_PASSWORD:-openlens}
      OPENLENS_REDIS_URL: redis://redis:6379/0
      OPENLENS_KAFKA_ENABLED: ${OPENLENS_KAFKA_ENABLED:-true}
      OPENLENS_KAFKA_BOOTSTRAP_SERVERS: ${OPENLENS_KAFKA_BOOTSTRAP_SERVERS:-kafka-1:19092,kafka-2:19092,kafka-3:19092}
      OPENLENS_KAFKA_TOPIC: ${OPENLENS_KAFKA_TOPIC:-crawl.urls}
      OPENLENS_KAFKA_GROUP_ID: ${OPENLENS_KAFKA_GROUP_ID:-crawlers}
      OPENLENS_CRAWL_ID: ${OPENLENS_CRAWL_ID:-default}
      OPENLENS_WORKER_ID: ${OPENLENS_WORKER_ID:-}
      OPENLENS_HEARTBEAT_INTERVAL_S: ${OPENLENS_HEARTBEAT_INTERVAL_S:-40}
      OPENLENS_FRONTIER_ADMIN_TOKEN: ${OPENLENS_FRONTIER_ADMIN_TOKEN:-}
      MODEL_ENABLED: ${MODEL_ENABLED:-false}
      MODEL_API_KEY: ${MODEL_API_KEY:-}
      MODEL_BASE_URL: ${MODEL_BASE_URL:-https://api.meta.ai/v1}
      MODEL_NAME: ${MODEL_NAME:-muse-spark-1.3-contributor}
    depends_on:
      backend:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka-1:
        condition: service_healthy
      kafka-2:
        condition: service_healthy
      kafka-3:
        condition: service_healthy
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
    healthcheck:
      test: ["CMD-SHELL", "grep -q crawl-worker /proc/1/cmdline || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks:
      - openlens

  # Kafka KRaft cluster (3 brokers, combined broker+controller mode, no
  # Zookeeper). Internal traffic uses INTERNAL://*:19092 (service DNS);
  # host debugging uses EXTERNAL localhost:9092/9094/9095. Topics
  # auto-create with 12 partitions so up to 12 crawler replicas each get
  # their own partition share. PLAINTEXT throughout: local dev only.
  kafka-1:
    image: apache/kafka:3.9.0
    hostname: kafka-1
    mem_limit: 2G
    cpus: 1.0
    logging: *default-logging
    ports:
      - "127.0.0.1:9092:9092"
    environment:
      CLUSTER_ID: 59f892a5-d185-40ec-b339-4973114d3a7a
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:19092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka-1:19092,EXTERNAL://localhost:9092
      KAFKA_LOG_RETENTION_HOURS: "24"
      KAFKA_LOG_RETENTION_BYTES: "1073741824"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka-1:9093,2@kafka-2:9093,3@kafka-3:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_NUM_PARTITIONS: 12
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes:
      - kafka1-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:19092 > /dev/null 2>&1"]
      interval: 30s
      timeout: 10s
      retries: 20
      start_period: 30s
    networks:
      - openlens

  kafka-2:
    image: apache/kafka:3.9.0
    hostname: kafka-2
    mem_limit: 2G
    cpus: 1.0
    logging: *default-logging
    ports:
      - "127.0.0.1:9094:9092"
    environment:
      CLUSTER_ID: 59f892a5-d185-40ec-b339-4973114d3a7a
      KAFKA_NODE_ID: 2
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:19092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka-2:19092,EXTERNAL://localhost:9094
      KAFKA_LOG_RETENTION_HOURS: "24"
      KAFKA_LOG_RETENTION_BYTES: "1073741824"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka-1:9093,2@kafka-2:9093,3@kafka-3:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_NUM_PARTITIONS: 12
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes:
      - kafka2-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:19092 > /dev/null 2>&1"]
      interval: 30s
      timeout: 10s
      retries: 20
      start_period: 30s
    networks:
      - openlens

  # Kafka monitor UI (Kafbat/kafka-ui): topics, consumer-group lag,
  # and message browser for the crawl.urls queue. Local dev only —
  # bound to localhost with no login, like the rest of this stack.
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    mem_limit: 512M
    cpus: 0.5
    logging: *default-logging
    ports:
      - "127.0.0.1:${KAFKA_UI_PORT:-8080}:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka-1:19092,kafka-2:19092,kafka-3:19092
    depends_on:
      kafka-1:
        condition: service_healthy
      kafka-2:
        condition: service_healthy
      kafka-3:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks:
      - openlens

  kafka-3:
    image: apache/kafka:3.9.0
    hostname: kafka-3
    mem_limit: 2G
    cpus: 1.0
    logging: *default-logging
    ports:
      - "127.0.0.1:9095:9092"
    environment:
      CLUSTER_ID: 59f892a5-d185-40ec-b339-4973114d3a7a
      KAFKA_NODE_ID: 3
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:19092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka-3:19092,EXTERNAL://localhost:9095
      KAFKA_LOG_RETENTION_HOURS: "24"
      KAFKA_LOG_RETENTION_BYTES: "1073741824"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka-1:9093,2@kafka-2:9093,3@kafka-3:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_NUM_PARTITIONS: 12
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes:
      - kafka3-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:19092 > /dev/null 2>&1"]
      interval: 30s
      timeout: 10s
      retries: 20
      start_period: 30s
    networks:
      - openlens

  postgres:
    image: postgres:16
    mem_limit: 1G
    cpus: 1.0
    logging: *default-logging
    # Connection headroom for crawler scale-out: each backend/crawler
    # process holds ~2 pools x OPENLENS_PG_POOL_SIZE connections
    # (default 5 -> ~10). 200 covers 12 crawler replicas + backend
    # with margin; raise with replicas (see Crawler-and-Frontier-Ops).
    # hba_file allows replication connections for the read replica
    # (stock pg_hba has no replication entry); see ./pg_hba.conf.
    command: postgres -c max_connections=${POSTGRES_MAX_CONNECTIONS:-200} -c hba_file=/etc/pg_hba/pg_hba.conf
    # Postgres DSM (parallel-query shared memory) lives in /dev/shm,
    # which Docker caps at 64MB: 12 workers evicting/querying a ~100k
    # queue exhaust it ("could not resize shared memory segment ... No
    # space left on device") and crash-loop every crawler. 256MB is
    # ample here; counts toward the 1G mem_limit above.
    shm_size: 256mb
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-openlens}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-openlens}
      POSTGRES_DB: ${POSTGRES_DB:-openlens}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./pg_hba.conf:/etc/pg_hba/pg_hba.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-openlens} -d $${POSTGRES_DB:-openlens}"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks:
      - openlens

  # Async streaming read replica: search/suggest reads land here while
  # writes stay on `postgres`. First boot basebackups from the primary
  # (takes minutes on a big DB; start_period covers it), later boots
  # resume WAL replay from the replica-data volume. The backend routes
  # reads here only when OPENLENS_PG_REPLICA_HOST is set and falls back
  # to the primary whenever the replica is unreachable — the replica
  # can lag, restart, or be absent without failing searches.
  postgres-replica:
    image: postgres:16
    mem_limit: 1G
    cpus: 1.0
    logging: *default-logging
    shm_size: 256mb
    command: ["bash", "/entry/postgres-replica-entrypoint.sh"]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-openlens}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-openlens}
      POSTGRES_DB: ${POSTGRES_DB:-openlens}
      POSTGRES_MAX_CONNECTIONS: ${POSTGRES_MAX_CONNECTIONS:-200}
    ports:
      - "127.0.0.1:${POSTGRES_REPLICA_PORT:-5433}:5432"
    volumes:
      - replica-data:/var/lib/postgresql/data
      - ./postgres-replica-entrypoint.sh:/entry/postgres-replica-entrypoint.sh:ro
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-openlens} -d $${POSTGRES_DB:-openlens}"]
      interval: 10s
      timeout: 5s
      retries: 24
      start_period: 180s
    networks:
      - openlens

  pgadmin:
    image: dpage/pgadmin4:8
    mem_limit: 512M
    cpus: 0.5
    logging: *default-logging
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-admin@openlens.io}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:-openlens}
      PGADMIN_CONFIG_SERVER_MODE: "False"
    ports:
      - "127.0.0.1:${PGADMIN_PORT:-5050}:80"
    volumes:
      - pgadmin-data:/var/lib/pgadmin
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://localhost:80/')\""]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks:
      - openlens

  redis:
    image: redis:7-alpine
    mem_limit: 512M
    cpus: 0.5
    logging: *default-logging
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks:
      - openlens

volumes:
  openlens-data:
  pgdata:
  replica-data:
  pgadmin-data:
  redis-data:
  kafka1-data:
  kafka2-data:
  kafka3-data:

networks:
  openlens:
