# OpenLens ranking profiles (one per search mode).
# Mode is selected from SearchRequest.mode; unknown modes fail loudly.
default_profile: default
profiles:
  default:
    description: "Baseline: provider-informed relevance, mild warning penalty."
    relevance_weight: 1.0
    warning_penalty: 0.5
    trust_boost: 0.25
    recency_boost: 0.0
    keyword_boost: 0.0
    keywords: []
  child-safe:
    description: "Warnings demote heavily; trusted sources boosted."
    relevance_weight: 1.0
    warning_penalty: 10.0
    trust_boost: 0.5
    recency_boost: 0.0
    keyword_boost: 0.0
    keywords: []
  news:
    description: "Boosts recent hits via metadata recency_score (0..1)."
    relevance_weight: 1.0
    warning_penalty: 0.5
    trust_boost: 0.25
    recency_boost: 2.0
    keyword_boost: 0.0
    keywords: []
  shopping:
    description: "Boosts hits mentioning purchase-oriented keywords."
    relevance_weight: 1.0
    warning_penalty: 0.5
    trust_boost: 0.25
    recency_boost: 0.0
    keyword_boost: 0.5
    keywords: ["buy", "price", "deal", "review", "shop"]
  travel:
    description: "Boosts hits mentioning travel-oriented keywords."
    relevance_weight: 1.0
    warning_penalty: 0.5
    trust_boost: 0.25
    recency_boost: 0.0
    keyword_boost: 0.5
    keywords: ["flight", "hotel", "guide", "itinerary", "trip"]
