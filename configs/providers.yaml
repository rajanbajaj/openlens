# Provider configuration for OpenLens (skeleton).
#
# Only entries with `enabled: true` are instantiated at startup; everything
# else is skipped entirely (never constructed, never contacted over the
# network). Both network-backed providers below ship disabled so the default
# setup is fully offline-safe with no API keys required.
#
# Per-entry keys:
#   type:      provider-type name resolved via the provider registry
#              (defaults to the entry name).
#   enabled:   instantiate this provider at startup (default false).
#   timeout_s: bounded per-request timeout in seconds (default 5).
#
# The `custom_index` entry refers to the SQLite FTS5 backend owned by the
# retrieval wave; it is the enabled default so search works with no infra.

providers:
  # Routing strategy: `single` (primary only), `fallback` (primary, then the
  # `fallback:` provider once on primary *failure*; an empty hit list never
  # triggers it), or `federated` (parallel fan-out over the
  # preference-selected providers with reciprocal-rank-fusion merging).
  strategy: single
  primary: custom_index
  # fallback: <other-enabled-provider>  # optional 2nd provider (!= primary):
  # primary *failure* retries once against it under its own timeout bound;
  # an empty hit list never triggers it. `strategy: fallback` requires it.
  # Federated-only knobs (ignored by the `single`/`fallback` strategies):
  # federated_timeout_s: overall fan-out deadline in seconds (default: max
  #   per-provider `timeout_s` + 1s; must satisfy 0 < value <= 300).
  # federated_primary_boost: fusion weight multiplier for the
  #   `provider_prefs.primary` provider (default 1.5; applied only when a
  #   primary preference is set).
  # federated_max_merged: cap on the merged federated window before the
  #   engine slices the requested page (default 200).

  custom_index:
    enabled: true
    type: custom_index
    timeout_s: 5

  opensearch:
    enabled: false
    type: opensearch
    hosts:
      - http://localhost:9200
    index: openlens
    timeout_s: 5
    # username: ${OPENSEARCH_USER:-}
    # password: ${OPENSEARCH_PASSWORD:-}
    verify_certs: true

  bing:
    enabled: false
    type: bing
    # endpoint defaults to https://api.bing.microsoft.com/v7.0/search
    # api_key resolves at load time; required when enabled.
    api_key: ${BING_API_KEY:-}
    timeout_s: 5

  # myengine:
  #   enabled: false
  #   type: http
  #   timeout_s: 5
  #   endpoint: ${MYENGINE_URL:-}
  #   method: GET                      # GET (query params) or POST (JSON body)
  #   api_key: ${MYENGINE_API_KEY:-}   # required when enabled, like bing
  #   auth_in: header                  # header or query
  #   auth_name: X-Api-Key             # header/query-param name
  #   params: { query: q, limit: count, offset: offset }   # GET param names
  #   body: { query: q, limit: count, offset: offset }     # POST JSON shape
  #   results_path: results            # dotted path to the hit list
  #   fields: { id: id, title: title, snippet: text, url: link }
  #   score: rank_decay                # or { field: score } for a numeric field
