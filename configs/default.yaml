# OpenLens default application configuration (skeleton).
#
# Loaded via `openlens.config.load_config`, so `${ENV_VAR}` and
# `${VAR:-default}` references resolve at load time and unresolved
# secrets fail startup validation loudly. `openlens.main.build_engine`
# wires this file into a live Engine: providers first (primary, then the
# optional `fallback:`), then plugins, then ranking.
#
# Only providers with `enabled: true` are instantiated at startup; the rest
# stay inert so tests and local runs need no network or keys.

app:
  name: "openlens"
  api_prefix: "/api/v1"

api:
  default_limit: 10
  max_limit: 100

# Search backends. `primary` serves every request; when `fallback` names a
# second enabled provider, a primary *failure* (never an empty hit list)
# retries once against the fallback under its own timeout bound.
providers:
  strategy: "single"
  primary: custom_index
  # fallback: custom_index_copy  # optional: must be enabled and != primary
  custom_index:
    enabled: true
    type: custom_index
    timeout_s: 5
    db_path: "data/openlens.db"
  opensearch:
    enabled: false
    type: opensearch
    hosts: ["${OPENSEARCH_HOST:-http://localhost:9200}"]
    index: openlens
    timeout_s: 5
    verify_certs: true

# Pipeline plugins, toggled without core edits. Entries are
# `{name, enabled, config?}` resolved via the plugin registry.
# The three mandatory FILTERING plugins run in the mandated order
# user-restrictions -> safety-filter -> privacy-filter; the registry
# declares that chain via plugin dependencies, so the pipeline's
# topological sort enforces it regardless of entry order here.
plugins:
  - name: user-restrictions
    enabled: true
    config: {}
  - name: safety-filter
    enabled: true
    config: {}
  - name: privacy-filter
    enabled: true
    config:
      # Street addresses match only config-supplied patterns (no
      # invented address grammar); email/phone/government_id use the
      # filter's built-in pinned patterns. All classes default to
      # exclusion.
      patterns:
        street_address:
          - '\b\d+\s+[A-Za-z]+(?:\s+[A-Za-z]+)?\s+(?:Street|Avenue|Road|Lane|Drive)\b'
  - name: baseline-scorer
    enabled: true
    config: {}
  # Scoring-pack signals (scoring-pack plan, step 6). Opt-in: disabled by
  # default so shipped behavior is unchanged. Tests enable these explicitly.
  - name: trust-scorer
    enabled: false
    config:
      reputation:
        trusted: []
        distrusted: []
  - name: freshness-scorer
    enabled: false
    config:
      half_life_days: 30
  - name: preference-scorer
    enabled: false
    config: {}
  # Rerank pack (rerank-pack plan). Opt-in: disabled by default so shipped
  # behavior is unchanged. Tests enable these explicitly.
  - name: attribute-enricher
    enabled: false
    config: {}
  - name: diversity-reranker
    enabled: false
    config: {}
  - name: news-reranker
    enabled: false
    config: {}
  - name: commerce-reranker
    enabled: false
    config: {}

ranking:
  default_profile: "default"

# Query intelligence (query-intelligence plan, steps 1-4). Consumed by
# `QueryProcessor.configure` via `SearchEngine.configure` — the standalone
# pre-retrieval stage (normalize -> intent -> expand), NOT a plugin-registry
# entry and NOT run inside the post-retrieval pipeline. Shapes mirror the
# stage-owned dataclasses: `normalizer` {max_length, on_overflow},
# `intent` {keywords, tie_priority, semantic_*}, `expansion`
# {synonym_sets, max_added_terms}. Suggested modes are validated against
# `get_profile` at startup; `child-safe` is never suggested, only explicit.
query:
  normalizer:
    max_length: 1000
    on_overflow: truncate
  intent:
    keywords:
      navigational: ["login", "signin", "sign in", "signup", "homepage", "official", "website", "portal", "download", "app"]
      shopping: ["buy", "price", "cheap", "deal", "deals", "shop", "shopping", "dress", "dresses", "shoes", "discount", "coupon", "sale", "store", "order", "under", "best"]
      travel: ["flight", "flights", "hotel", "hotels", "trip", "travel", "vacation", "booking", "itinerary", "visa", "beach"]
      news: ["news", "breaking", "headlines", "election", "elections", "results", "today", "latest", "update"]
      informational: ["how", "what", "why", "when", "who", "explain", "tutorial", "guide", "review", "reviews", "compare"]
    tie_priority: ["navigational", "shopping", "travel", "news", "informational"]
    semantic_enabled: false
    semantic_timeout_s: 1.0
  expansion:
    synonym_sets:
      apparel: ["dress", "dresses", "gown"]
      footwear: ["shoe", "shoes", "sneaker", "sneakers"]
      mobile: ["phone", "phones", "smartphone", "mobile"]
      air-travel: ["flight", "flights", "airfare"]
      lodging: ["hotel", "hotels", "lodging"]
      television: ["tv", "television"]
      computing: ["laptop", "laptops", "notebook"]
      pricing: ["cheap", "affordable", "budget"]
    max_added_terms: 8

# Ingestion policies for the polite crawler + incremental indexer
# (crawler-index plan, step 4). Consumed by `PoliteCrawler.configure()`
# (and the future indexer `configure()`): unknown keys are rejected
# loudly there because `load_config` itself is permissive. Policies
# only — no URLs are fetched unless explicitly configured.
indexing:
  timeout_s: 5
  crawl_delay_s: 0.5
  max_pages: 100
  max_bytes: 1000000
  max_queued_urls: 10000
  max_tracked_domains: 1000
  allowed_content_types: ["text/html", "text/plain"]
  allow_domains: []
  deny_domains: []
  user_agent: "OpenLensBot/1.0"
  respect_robots: true

# Observability (observability-cli plan, step 4). Consumed by
# `openlens.main.create_app`: `logging.level` selects the stdlib level
# for the per-request JSON search log (default INFO; the raw query text
# is logged at DEBUG only); `metrics.enabled` gates `GET /metrics`
# (default false — the route 404s unless enabled).
logging:
  level: INFO
metrics:
  enabled: false
