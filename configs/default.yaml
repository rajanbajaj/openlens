# OpenLens default application configuration (skeleton).
#
# Loaded via `openlens.config.load_config`, so `${ENV_VAR}` and
# `${VAR:-default}` references resolve at load time and unresolved
# secrets fail startup validation loudly. `openlens.main.build_engine`
# wires this file into a live Engine: providers first (primary, then the
# optional `fallback:`), then plugins, then ranking.
#
# Only providers with `enabled: true` are instantiated at startup; the rest
# stay inert so tests and local runs need no network or keys.

app:
  name: "openlens"
  api_prefix: "/api/v1"

api:
  default_limit: 10
  max_limit: 100

# Search backends. `primary` serves every request; when `fallback` names a
# second enabled provider, a primary *failure* (never an empty hit list)
# retries once against the fallback under its own timeout bound.
providers:
  strategy: "single"
  primary: custom_index
  # fallback: custom_index_copy  # optional: must be enabled and != primary
  custom_index:
    enabled: true
    type: custom_index
    timeout_s: 5
    db_path: "data/openlens.db"
    # Hybrid retrieval (modern-search-backend plan, step 5 wiring).
    # Disabled by default: plain FTS5 order is served and no embedding
    # backend is contacted. Set true plus an enabled `models:` backend
    # to fuse the embedding signal via RRF (fail-open on any error).
    semantic_enabled: false

# Document store backend selection (db-connectors plan, step 4).
# `storage.backend` is the single switch (`sqlite` | `mysql` |
# `postgres`, default `sqlite`); the provider-entry `db_path` above keeps
# working as the SQLite backend's field, so a config with no `storage:`
# section at all still boots SQLite. Connection fields resolve
# `${ENV_VAR}` / `${VAR:-default}` via `load_config`. Server backends
# need their optional extras (`pip install openlens[mysql]` /
# `openlens[postgres]`); drivers lazy-import, so unconfigured backends
# add no import-time dependency.
#
# Storage decision: Postgres is the default store (see
# `deploy/local/docker-compose.yml`, which runs it plus a pgAdmin UI).
# SQLite stays as the zero-dependency offline fallback (code default
# when no `storage:` section exists) and for tests. Maps are out of
# scope (no geo index, no map UI; travel stays text filters). All
# backends carry the same crawler-truth indexed columns
# (`content_type`, `published`) plus full-text search over
# `title`/`content`, with the vertical remainder in metadata JSON; only
# those columns are promoted because the crawler emits no vertical
# (product/hotel/book/recipe) fields. AI capabilities stay on the
# `models:` backends (configs/models.yaml).
storage:
  backend: postgres
  sqlite:
    db_path: "data/openlens.db"
  mysql:
    host: "${OPENLENS_MYSQL_HOST:-localhost}"
    port: "${OPENLENS_MYSQL_PORT:-3306}"
    database: "${OPENLENS_MYSQL_DATABASE:-openlens}"
    user: "${OPENLENS_MYSQL_USER:-root}"
    password: "${OPENLENS_MYSQL_PASSWORD:-}"
    table: "documents"
  postgres:
    host: "${OPENLENS_PG_HOST:-localhost}"
    port: "${OPENLENS_PG_PORT:-5432}"
    dbname: "${OPENLENS_PG_DBNAME:-openlens}"
    user: "${OPENLENS_PG_USER:-postgres}"
    password: "${OPENLENS_PG_PASSWORD:-}"
    table: "documents"
    # Connection pool shared by the document + frontier stores. Each store
    # opens its own pool, so one process holds ~2 * pool_size server
    # connections; N workers hold N times that (see README pool math).
    pool_size: "${OPENLENS_PG_POOL_SIZE:-5}"
    connect_timeout: "${OPENLENS_PG_CONNECT_TIMEOUT:-5}"
    checkout_timeout: "${OPENLENS_PG_CHECKOUT_TIMEOUT:-5.0}"
    # Optional async streaming read replica: search/suggest reads go
    # here while writes stay on the primary, so crawl write pressure
    # cannot starve search. Empty host disables it (default: primary
    # serves everything, zero behavior change). user/password/dbname
    # fall back to the primary's when omitted. Replica lag is
    # milliseconds-to-seconds: freshly crawled docs appear in search
    # with a delay. Only the backend sets these; crawlers stay on the
    # primary so dedup checks never read stale rows.
    replica:
      host: "${OPENLENS_PG_REPLICA_HOST:-}"
      port: "${OPENLENS_PG_REPLICA_PORT:-5432}"

# Pipeline plugins, toggled without core edits. Entries are
# `{name, enabled, config?}` resolved via the plugin registry.
# The three mandatory FILTERING plugins run in the mandated order
# user-restrictions -> safety-filter -> privacy-filter; the registry
# declares that chain via plugin dependencies, so the pipeline's
# topological sort enforces it regardless of entry order here.
plugins:
  - name: user-restrictions
    enabled: true
    config: {}
  - name: safety-filter
    enabled: true
    config: {}
  - name: privacy-filter
    enabled: true
  - name: mode-category-filter
    enabled: true
    config: {}
  - name: date-range-filter
    enabled: true
    config: {}
    config:
      # Street addresses match only config-supplied patterns (no
      # invented address grammar); email/phone/government_id use the
      # filter's built-in pinned patterns. All classes default to
      # exclusion.
      patterns:
        street_address:
          - '\b\d+\s+[A-Za-z]+(?:\s+[A-Za-z]+)?\s+(?:Street|Avenue|Road|Lane|Drive)\b'
  - name: baseline-scorer
    enabled: true
    config: {}
  # Scoring-pack signals (scoring-pack plan, step 6). Opt-in: disabled by
  # default so shipped behavior is unchanged. Tests enable these explicitly.
  - name: trust-scorer
    enabled: true
    config:
      reputation:
        trusted: []
        distrusted: []
  - name: authority-scorer
    enabled: true
    config:
      half_saturation: 10
  - name: performance-scorer
    enabled: true
    config:
      fast_ms: 300
      slow_ms: 8000
  - name: freshness-scorer
    enabled: true
    config:
      half_life_days: 30
  - name: preference-scorer
    enabled: true
    config: {}
  # Rerank pack (rerank-pack plan). Opt-in: disabled by default so shipped
  # behavior is unchanged. Tests enable these explicitly.
  - name: attribute-enricher
    enabled: true
    config: {}
  - name: diversity-reranker
    enabled: true
    config: {}
  - name: news-reranker
    enabled: true
    config: {}
  - name: commerce-reranker
    enabled: true
    config: {}
  # Integrity pack (IMPL-2): safety/privacy/fairness/news-trust/sponsored
  # signals scored purely from indexed metadata + indexed text. Opt-in:
  # disabled by default so shipped behavior is unchanged.
  - name: integrity-scorer
    enabled: true
    config: {}
  - name: opinion-detector
    enabled: true
    config: {}
  # AI summary (Cat10): opt-in, disabled by default so shipped behavior
  # is unchanged. Needs an enabled `models:` backend (configs/models.yaml);
  # without one the engine omits AI plugins rather than falling back.
  - name: ai-summary
    enabled: false
    config: {}

ranking:
  default_profile: "default"

# Query intelligence (query-intelligence plan, steps 1-4). Consumed by
# `QueryProcessor.configure` via `SearchEngine.configure` — the standalone
# pre-retrieval stage (normalize -> intent -> expand), NOT a plugin-registry
# entry and NOT run inside the post-retrieval pipeline. Shapes mirror the
# stage-owned dataclasses: `normalizer` {max_length, on_overflow},
# `intent` {keywords, tie_priority, semantic_*}, `expansion`
# {synonym_sets, max_added_terms, expand_rewrite}, `context`
# {enabled, max_history_terms}. Context history is request-scoped and
# never persisted; `child-safe` is never suggested, only explicit.
# Suggested modes are validated against `get_profile` at startup.
query:
  normalizer:
    max_length: 1000
    on_overflow: truncate
  context:
    enabled: false
    max_history_terms: 20
  intent:
    keywords:
      navigational: ["login", "signin", "sign in", "signup", "homepage", "official", "website", "portal", "download", "app"]
      shopping: ["buy", "price", "cheap", "deal", "deals", "shop", "shopping", "dress", "dresses", "shoes", "discount", "coupon", "sale", "store", "order", "under", "best"]
      travel: ["flight", "flights", "hotel", "hotels", "trip", "travel", "vacation", "booking", "itinerary", "visa", "beach"]
      news: ["news", "breaking", "headlines", "election", "elections", "results", "today", "latest", "update"]
      informational: ["how", "what", "why", "when", "who", "explain", "tutorial", "guide", "review", "reviews", "compare"]
    tie_priority: ["navigational", "shopping", "travel", "news", "informational"]
    semantic_enabled: false
    semantic_timeout_s: 1.0
  expansion:
    synonym_sets:
      apparel: ["dress", "dresses", "gown"]
      footwear: ["shoe", "shoes", "sneaker", "sneakers"]
      mobile: ["phone", "phones", "smartphone", "mobile"]
      air-travel: ["flight", "flights", "airfare"]
      lodging: ["hotel", "hotels", "lodging"]
      television: ["tv", "television"]
      computing: ["laptop", "laptops", "notebook"]
      pricing: ["cheap", "affordable", "budget"]
    max_added_terms: 8
    # Optional single string-rewrite variant (one synonym substituted per
    # expandable base term, arity preserved). Off by default: the
    # structured OR-of-ANDs variant fan-out is served instead.
    expand_rewrite: false

# Ingestion policies for the polite crawler + incremental indexer
# (crawler-index plan, step 4). Consumed by `PoliteCrawler.configure()`
# (and the future indexer `configure()`): unknown keys are rejected
# loudly there because `load_config` itself is permissive. Policies
# only — no URLs are fetched unless explicitly configured.
indexing:
  timeout_s: 5
  crawl_delay_s: 0.5
  max_pages: 100
  max_bytes: 1000000
  max_queued_urls: 10000
  max_tracked_domains: 1000
  allowed_content_types: ["text/html", "text/plain"]
  allow_domains: []
  deny_domains: []
  # Case-insensitive substring hits against the full discovered URL drop
  # the link before it ever queues (nav-filter backstop the built-in
  # junk rules miss, e.g. vendor-specific tracking paths). Empty by
  # default; manage from the admin indexing editor.
  deny_url_patterns: []
  user_agent: "OpenLensBot/1.0"
  respect_robots: true
  # Per-domain crawl policy (index breadth, plan step 4). Active keys
  # below carry the defaults (no per-domain overrides, unlimited
  # link-following depth); add entries under `domain_policies` to scope
  # a crawl:
  # `allow: false` blocks the domain even when the global allowlist would
  # permit it; `allow: true` exempts it from the `allow_domains` gate
  # (global `deny_domains` still wins). `rate_limit_s` is the minimum gap
  # between hits to that domain (max with `crawl_delay_s` and robots
  # Crawl-delay). `max_depth` caps link-following for that domain
  # (seeds are depth 0); `default_max_depth` caps every other domain.
  # `max_pages` caps fetched pages for that domain per crawl run —
  # the trap defense for hosts with thousands of near-empty pages.
  # Malformed policy blocks fail startup validation loudly (fail-closed).
  domain_policies:
    arxiv.org: {rate_limit_s: 3.0}
  # Example entries (add under domain_policies to scope a crawl):
  #   example.com: {allow: true, rate_limit_s: 1.0, max_depth: 2}
  #   slow.example.org: {rate_limit_s: 5.0}
  #   trap.example.net: {max_pages: 200}
  #   blocked.example.net: {allow: false}
  default_max_depth: null

# Persistent URL frontier (frontier plan). `frontier.enabled` gates the
# persistent crawl path (`PoliteCrawler.crawl(..., frontier_store=...)`):
# when true, seeds live in the `frontier_queue` table (normalized URL
# primary key), checkpoints in `crawl_checkpoints`, and these settings
# in `frontier_settings` (DB row wins once written; values below are the
# seed defaults). Tables are created alongside `documents` on every
# backend (SQLite executescript + Postgres DDL); no new service needed.
frontier:
  enabled: ${OPENLENS_FRONTIER_ENABLED:-true}
  crawl_id: "default"
  checkpoint_interval_pages: ${OPENLENS_FRONTIER_CKPT_PAGES:-10}
  max_attempts_per_url: 3
  queue_table: "frontier_queue"
  checkpoint_table: "crawl_checkpoints"
  # Shared-queue coordination (storage/frontier.py). Lease TTL must exceed
  # the slowest fetch (timeout_s + max crawl-delay); workers heartbeat
  # every TTL/3 and the reaper recovers expired claims.
  lease_ttl_s: "${OPENLENS_LEASE_TTL_S:-120}"
  heartbeat_interval_s: "${OPENLENS_HEARTBEAT_INTERVAL_S:-40}"
  reaper_interval_s: "${OPENLENS_REAPER_INTERVAL_S:-30}"

# Kafka-backed URL queue for distributed crawling (kafka plan).
# `kafka.enabled` switches seed/URL distribution to the `crawl.urls`
# topic: every crawler replica joins the same consumer group
# (`group_id`), so Kafka assigns each URL to exactly one live worker
# and `docker compose up --scale crawler=N` fans out with no extra
# coordination. Postgres keeps documents, checkpoints, settings, and
# the seen-set (normalized-URL dedup makes redeliveries no-ops), so the
# store-backed claim path stays as the offline/test fallback.
# Disabled by default — set OPENLENS_KAFKA_ENABLED=true in compose to
# turn it on. Brokers speak PLAINTEXT (local dev only, no auth).
kafka:
  enabled: ${OPENLENS_KAFKA_ENABLED:-false}
  bootstrap_servers: ${OPENLENS_KAFKA_BOOTSTRAP_SERVERS:-localhost:9092}
  topic: ${OPENLENS_KAFKA_TOPIC:-crawl.urls}
  group_id: ${OPENLENS_KAFKA_GROUP_ID:-crawlers}
  publish_timeout_s: 5.0
  poll_timeout_s: 1.0
  max_poll_interval_ms: 900000
  # Worst-case poll work (~25 pages x 8s) stays well under
  # max_poll_interval_ms; see DEFAULT_MAX_PAGES_PER_POLL.
  max_pages_per_poll: 25

# Server-side analytics pipeline: API publishes fire-and-forget events to
# the `analytics.events` Kafka topic, `analytics-worker` batch-inserts
# them into the analytics store, and retention purges old rows. The store
# backend is the single switch (`sqlite` | `clickhouse`, shipped default
# `sqlite` so offline/tests boot with no services — compose overrides to
# `clickhouse`). ClickHouse is a separate database on purpose: analytics
# append volume must never contend with search reads or frontier writes.
# Event names and prop keys are a closed allowlist (see
# `src/openlens/analytics/events.py`); raw query text is never stored.
analytics:
  enabled: ${OPENLENS_ANALYTICS_ENABLED:-true}
  topic: ${OPENLENS_ANALYTICS_TOPIC:-analytics.events}
  group_id: ${OPENLENS_ANALYTICS_GROUP_ID:-analytics}
  batch_size: ${OPENLENS_ANALYTICS_BATCH_SIZE:-100}
  flush_interval_s: ${OPENLENS_ANALYTICS_FLUSH_INTERVAL_S:-5.0}
  retention_days: ${OPENLENS_ANALYTICS_RETENTION_DAYS:-90}
  retention_check_s: 3600.0
  store:
    backend: ${OPENLENS_ANALYTICS_BACKEND:-sqlite}
    sqlite:
      # File-backed by default so the API and the analytics-worker share
      # one durable store off-compose (``:memory:`` gives every process
      # a private empty database, so counts would always read zero).
      # Override with OPENLENS_ANALYTICS_SQLITE_PATH (``:memory:`` keeps
      # tests hermetic).
      db_path: ${OPENLENS_ANALYTICS_SQLITE_PATH:-data/openlens-analytics.db}
    clickhouse:
      host: ${OPENLENS_CLICKHOUSE_HOST:-localhost}
      port: ${OPENLENS_CLICKHOUSE_PORT:-8123}
      database: ${OPENLENS_CLICKHOUSE_DB:-openlens_analytics}
      user: ${OPENLENS_CLICKHOUSE_USER:-default}
      password: ${OPENLENS_CLICKHOUSE_PASSWORD:-}

# Search-result cache (caching-audit plan). `cache.backend` is the single
# switch (`memory` | `sqlite` | `redis`, shipped default `redis` — see
# `deploy/local/docker-compose.yml`); `enabled: false` turns caching off.
# Exactly one pipeline hook caches the final ranked list post-filtering,
# so safety can never be bypassed; TTL bounds staleness (cross-process
# index writes rely on TTL expiry), `cache purge` drops everything
# manually. Missing/unreachable backends warn and run uncached, never
# crash boot (the code falls back to `memory` when no `cache:` section
# exists).
cache:
  enabled: true
  backend: redis
  ttl_s: 120
  max_entries: 1000
  sqlite:
    path: "data/openlens-cache.db"
  redis:
    url: "${OPENLENS_REDIS_URL:-redis://localhost:6379/0}"

# Observability (observability-cli plan, step 4). Consumed by
# `openlens.main.create_app`: `logging.level` selects the stdlib level
# for the per-request JSON search log (default INFO; the raw query text
# is logged at DEBUG only); `metrics.enabled` gates `GET /metrics`
# (default false — the route 404s unless enabled).
logging:
  level: INFO
metrics:
  enabled: false
